version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    target-branch: dependencies
    open-pull-requests-limit: 5
    assignees:
      - nerjs
    labels:
      - dependencies
      - bot
    groups:
      # Groups are matched in order: the pairs below must stay version-locked,
      # so they claim their crates before the catch-all groups do.
      axum:
        patterns:
          - axum
          - axum-test
      logging:
        patterns:
          - tracing
          - tracing-subscriber
      serde:
        patterns:
          - serde
          - serde_json
      tokio:
        patterns:
          - tokio
          - tokio-stream
      # dependency-type is unsupported for cargo, so dev crates are listed by name.
      dev:
        patterns:
          - once_cell
          - rstest
          - tempfile
          - uuid
      rust-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dependencies
    open-pull-requests-limit: 5
    assignees:
      - nerjs
    labels:
      - dependencies
      - bot
      - github-actions
    groups:
      gha-minor-patch:
        update-types:
          - minor
          - patch
