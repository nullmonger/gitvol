[package]
name = "gitvol"
version = "0.2.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.7", features = ["tower-log", "tokio"] }
tracing = { version = "0.1.44", features = ["async-await", "log", "valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "fs", "macros", "sync", "process"] }
tokio-stream = "0.1.18"
clap = { version = "4.5.60", default-features = false, features = ["derive", "std", "help"] }
thiserror = "2.0.18"
async-trait = "0.1.89"
git-url-parse = "0.4.5"


[dev-dependencies]
axum-test = "18.3.0"
once_cell = "1.21.4"
rstest = "0.26.1"
tempfile = "3.27.0"
uuid = { version = "1.23.2", features = ["v4"] }


[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
